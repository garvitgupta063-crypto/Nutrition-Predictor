<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nutrition prediction</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { background: #f3f7f4; color: #1c3024; margin: 0; }
      main { background: #fff; border-radius: 14px; box-shadow: 0 10px 28px #1937251a; margin: 48px auto; max-width: 580px; padding: 32px; }
      h1 { margin-top: 0; } p { color: #4c6153; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(2, 1fr); }
      label { display: grid; font-size: .9rem; font-weight: 600; gap: 6px; text-transform: capitalize; }
      input { border: 1px solid #c8d2cb; border-radius: 7px; font: inherit; padding: 10px; }
      button { background: #176b3a; border: 0; border-radius: 7px; color: #fff; cursor: pointer; font: inherit; font-weight: 700; margin-top: 24px; padding: 12px 20px; }
      .message { border-radius: 7px; margin-top: 20px; padding: 14px; } .result { background: #dff4e5; color: #125d30; } .error { background: #fce5e4; color: #9e2520; }
      @media (max-width: 520px) { main { border-radius: 0; margin: 0; min-height: 100vh; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Nutrition prediction</h1>
      <p>Enter nutritional values to generate a prediction.</p>
      <form method="post">
        <div class="grid">
          {% for feature in features %}
          <label for="{{ feature }}">{{ feature.replace('_', ' ') }}
            <input id="{{ feature }}" name="{{ feature }}" type="number" min="0" step="any" required value="{{ values.get(feature, '') }}">
          </label>
          {% endfor %}
        </div>
        <button type="submit">Predict</button>
      </form>
      {% if prediction is not none %}<div class="message result">Prediction: <strong>{{ '%.2f'|format(prediction) }}</strong></div>{% endif %}
      {% if error %}<div class="message error">{{ error }}</div>{% endif %}
    </main>
  </body>
</html>
